apiVersion: batch/v1
kind: CronJob
metadata:
  name: poc-dbt-daily
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: dbt
              image: your-registry/databricks-platform-poc:latest
              workingDir: /app/dbt
              env:
                - name: DATABRICKS_HOST
                  valueFrom:
                    secretKeyRef:
                      name: databricks-creds
                      key: host
                - name: DATABRICKS_HTTP_PATH
                  valueFrom:
                    secretKeyRef:
                      name: databricks-creds
                      key: http_path
                - name: DATABRICKS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: databricks-creds
                      key: token
              command:
                - /bin/sh
                - -lc
                - |
                  dbt seed
                  dbt run
                  dbt test
