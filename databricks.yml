bundle:
  name: databricks-platform

targets:
  dev:
    workspace:
      host: ${var.DATABRICKS_HOST}

variables:
  catalog:
    default: main
  schema:
    default: tymex_platform
  warehouse_id:
    default: ""

resources:
  jobs:
    bronze_ingest_job:
      name: tymex-bronze-ingest-bundle
      tasks:
        - task_key: bronze
          spark_python_task:
            python_file: ../src/jobs/bronze_ingest.py
          new_cluster:
            spark_version: 13.3.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1
    silver_transform_job:
      name: tymex-silver-transform-bundle
      tasks:
        - task_key: silver
          spark_python_task:
            python_file: ../src/jobs/silver_transform.py
          new_cluster:
            spark_version: 13.3.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1
    gold_kpi_job:
      name: tymex-gold-kpi-bundle
      tasks:
        - task_key: gold
          spark_python_task:
            python_file: ../src/jobs/gold_kpi.py
          new_cluster:
            spark_version: 13.3.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1
